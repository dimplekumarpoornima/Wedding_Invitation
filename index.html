<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dimple Kumar & Poornima Reddy — Wedding Invitation</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;background:#f4eee2}
body{overflow-x:hidden}
.invite{position:relative;width:100%;margin:0 auto;line-height:0}
.invite img{display:block;width:100%;height:auto}
.hotspot{position:absolute;display:block;z-index:20;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.remind{left:18%;top:63%;width:64%;height:8.5%}
.directions{left:25%;top:81%;width:50%;height:9%}

/* Desktop: fit the complete invitation inside the monitor */
@media (min-width:900px){
  html,body{height:100%;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center}
  .invite{
    height:100vh;
    width:auto;
    max-width:100vw;
    aspect-ratio:3/4;
  }
  .invite img{width:100%;height:100%;object-fit:contain}
}

/* Mobile: deliberately allow the invitation to extend below the screen.
   The guest scrolls naturally to see the full invitation. */
@media (max-width:899px){
  html,body{min-height:100%;height:auto;overflow-x:hidden;overflow-y:auto}
  body{display:block}
  .invite{
    width:100vw;
    max-width:none;
    height:auto;
  }
  .invite img{
    width:100%;
    height:auto;
    object-fit:initial;
  }
}
</style>
</head>
<body>
<main class="invite">
<img src="wedding-invitation.png" alt="Dimple Kumar and Poornima Reddy Wedding Invitation">
<a class="hotspot remind" href="https://calendar.google.com/calendar/render?action=TEMPLATE&text=Dimple+Kumar+%26+Poornima+Reddy+-+Wedding+Celebration&dates=20261029T190000%2F20261029T210000&details=Reception+%26+Dinner%3A+Thursday%2C+29+October+2026+at+7%3A00+PM+onwards.%0AWedding%3A+Friday%2C+30+October+2026+from+7%3A00+AM+to+8%3A00+AM.%0APushkarakalam%3A+7%3A49+AM.%0A%0AVenue%3A+R.P.R.+Convention+Centre%2C+Opp.+H.P.+Petrol+Bunk%2C+Thukivakam%2C+150+Bypass+Road%2C+Tirupati+Rural.&location=R.P.R.+Convention+Centre%2C+Opp.+H.P.+Petrol+Bunk%2C+Thukivakam%2C+150+Bypass+Road%2C+Tirupati+Rural&ctz=Asia%2FKolkata" target="_blank" rel="noopener" aria-label="Remind me - add to calendar"></a>
<a class="hotspot directions" href="https://share.google/z0rKY6E8mGrfZU7jh" target="_blank" rel="noopener" aria-label="Get directions to venue"></a>
</main>
</body>
</html>
