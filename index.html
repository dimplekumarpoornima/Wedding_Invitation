<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dimple Kumar & Poornima Reddy — Wedding Invitation</title>
<style>
* { box-sizing:border-box; }
html, body {
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  background:#f4eee2;
}

/* MOBILE / TABLET:
   Let the complete image determine page height.
   No fixed viewport height, so there is no blank area below. */
body {
  overflow-x:hidden;
}
.invite {
  position:relative;
  width:100%;
  max-width:1024px;
  margin:0 auto;
  line-height:0;
}
.invite img {
  display:block;
  width:100%;
  height:auto;
}
.hotspot {
  position:absolute;
  display:block;
  z-index:20;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}
.remind {
  left:18%;
  top:63%;
  width:64%;
  height:8.5%;
}
.directions {
  left:25%;
  top:81%;
  width:50%;
  height:9%;
}

/* DESKTOP / MONITOR:
   Fit the complete 3:4 invitation inside BOTH the viewport width
   and viewport height. This prevents the top/bottom clipping seen
   in the supplied monitor screenshot. */
@media (min-width: 900px) {
  html, body {
    width:100%;
    height:100%;
    min-height:0;
    overflow:hidden;
  }
  body {
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .invite {
    width:min(100vw, 75vh);
    height:min(100vh, 133.333333vw);
    aspect-ratio:3 / 4;
    max-width:none;
    max-height:100vh;
    margin:0;
    flex:0 0 auto;
  }
  .invite img {
    width:100%;
    height:100%;
    object-fit:contain;
  }
}

/* Very tall/narrow phones: still use the natural image height. */
@media (max-width:899px) {
  .invite {
    width:100vw;
    max-width:none;
  }
}
</style>
</head>
<body>
<main class="invite">
  <img src="wedding-invitation.png"
       alt="Dimple Kumar and Poornima Reddy Wedding Invitation">
  <a class="hotspot remind"
     href="https://calendar.google.com/calendar/render?action=TEMPLATE&text=Dimple+Kumar+%26+Poornima+Reddy+-+Wedding+Celebration&dates=20261029T190000%2F20261029T210000&details=Reception+%26+Dinner%3A+Thursday%2C+29+October+2026+at+7%3A00+PM+onwards.%0AWedding%3A+Friday%2C+30+October+2026+from+7%3A00+AM+to+8%3A00+AM.%0APushkarakalam%3A+7%3A49+AM.%0A%0AVenue%3A+R.P.R.+Convention+Centre%2C+Opp.+H.P.+Petrol+Bunk%2C+Thukivakam%2C+150+Bypass+Road%2C+Tirupati+Rural.&location=R.P.R.+Convention+Centre%2C+Opp.+H.P.+Petrol+Bunk%2C+Thukivakam%2C+150+Bypass+Road%2C+Tirupati+Rural&ctz=Asia%2FKolkata"
     target="_blank"
     rel="noopener"
     aria-label="Remind me - add to calendar"></a>
  <a class="hotspot directions"
     href="https://share.google/z0rKY6E8mGrfZU7jh"
     target="_blank"
     rel="noopener"
     aria-label="Get directions to venue"></a>
</main>
</body>
</html>
